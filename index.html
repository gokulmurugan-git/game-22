<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-O Game (Tic-Tac-Toe)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Game Header -->
        <div class="header">
            <h1>X-O Game</h1>
            <p class="subtitle">Two-Player Tic-Tac-Toe</p>
        </div>

        <!-- Score Board -->
        <div class="score-board">
            <div class="score-item">
                <span class="score-label">X Wins</span>
                <span class="score-value" id="xWins">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Draws</span>
                <span class="score-value" id="draws">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">O Wins</span>
                <span class="score-value" id="oWins">0</span>
            </div>
        </div>

        <!-- Current Turn Display -->
        <div class="turn-display">
            <p id="turnMessage">Player <span id="currentPlayer">X</span>'s Turn</p>
        </div>

        <!-- Game Board -->
        <div class="game-board">
            <!-- Each cell has a data-index from 0 to 8 -->
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <!-- Game Status Message -->
        <div class="game-status">
            <p id="statusMessage"></p>
        </div>

        <!-- New Game Button -->
        <button class="new-game-btn" id="newGameBtn">New Game</button>
    </div>

    <!-- Link to JavaScript -->
    <script src="script.js"></script>
</body>
</html>
